<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stockfish 18 – lokaler Test</title><style>body{font-family:system-ui;margin:0;padding:24px;background:#fff;color:#111}#s{padding:18px;border-radius:12px;background:#eee;font-size:20px}.ok{color:#087f23}.bad{color:#a00}.log{margin-top:16px;font:13px ui-monospace,monospace;white-space:pre-wrap}</style></head><body><h1>Stockfish 18 lokaler Test</h1><div id="s">Teste…</div><div id="log" class="log"></div><script>const s=document.getElementById('s'),log=document.getElementById('log');let w,done=false,t=setTimeout(()=>fail('Timeout: kein uciok/readyok. Prüfe stockfish-18-lite-single.js und stockfish-18-lite-single.wasm.'),15000);function fail(m){if(done)return;done=true;clearTimeout(t);s.textContent='FEHLER — '+m;s.className='bad'}try{w=new Worker('./stockfish-18-lite-single.js');w.onerror=()=>fail('Worker konnte nicht geladen werden.');w.onmessage=e=>{const x=String(e.data||'');log.textContent+=x+'\n';if(x==='uciok')w.postMessage('isready');if(x==='readyok'){done=true;clearTimeout(t);s.textContent='OK — Stockfish 18 Lite Single ist lokal verbunden und bereit.';s.className='ok';w.postMessage('position startpos');w.postMessage('go movetime 200')}if(x.startsWith('bestmove '))log.textContent+='TEST-BESTMOVE: '+x+'\n'};w.postMessage('uci')}catch(e){fail(e.message)}</script></body></html>
